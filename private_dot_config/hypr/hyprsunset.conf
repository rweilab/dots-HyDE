# ~/.config/hypr/hyprsunset.conf

# Maximum gamma allowed (brightness multiplier)
max-gamma = 150

# Daytime profile – bright, default temperature
profile {
    time = 07:00      # 7 AM
    identity = true   # ignore temperature, just set gamma
    gamma = 1.35       # increase perceived brightness}

# Evening/Night profile – warmer, slightly dimmer
profile {
    time = 21:00      # 9 PM
    temperature = 4000 # warmer light
    gamma = 1.1        # slight dimming for night
}
