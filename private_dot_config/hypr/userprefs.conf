# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat 
    # numlock_by_default = true

    # 🔗 See https://wiki.hyprland.org/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

    repeat_rate = 50
    repeat_delay = 200
}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    vfr = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}


general {
    gaps_in = 1
    gaps_out = 1
    border_size = 1
}

decoration {
   	active_opacity = 1
	inactive_opacity = 0.925
   	fullscreen_opacity = 1.0
	# these "overrides" don't do anything to the opacity :/
	shadow {
	enabled = false
	}
	blur {
	enabled = false
	}
}

animations {
    enabled = no
}


# Override windowrules.conf opacity
windowrule = opacity 1.0 1.0, match:class .*

# Startup executions
exec-once = nohup /usr/bin/awww-daemon >/dev/null 2>&1 &
exec-once = sunsetr
exec-once = [workspace 1 silent] bash -c "until ping -c1 1.1.1.1 >/dev/null 2>&1; do sleep 5; done; firefox"
exec-once = [workspace 5 silent] bash -c "until ping -c1 1.1.1.1 >/dev/null 2>&1; do sleep 0.1; done; protonvpn-app"
exec-once = [workspace 9 silent] emacs
exec-once = [workspace 10 silent] kitty
exec-once = [workspace 10 silent] kitty


$TERMINAL = kitty zsh
unbind = $mainMod, T
bind = $mainMod, T, exec, kitty
$EDITOR = nvim


# Directly execute rofi instead of with hyde-shell wrappers for decreased latency
unbind = $mainMod, A
bind = $mainMod, A, exec, rofi -show drun -show-icons -theme style_1

